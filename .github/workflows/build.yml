name: Build TheLastSignal

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - name: Build
        run: |
          set +e
          gradle build --no-daemon 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            python3 - <<'PY'
          import re
          L=open('build.log',errors='replace').read().splitlines()
          E=[]
          for i,l in enumerate(L):
              if re.search(r'error:|\.java:\d+: |FAILED|What went wrong',l):
                  E.append(' | '.join(x.strip() for x in L[i:i+3]))
          for i in range(0,min(len(E),60),6):
              print('::error title=compile %d::%s'%(i//6,'%0A'.join(E[i:i+6])[:3500]))
          PY
          fi
          exit $rc
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TheLastSignal-1.20.1-Forge
          path: build/libs/TheLastSignal-1.20.1-Forge.jar

  smoke-server:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - name: Headless server smoke test (generates chunks in all 48 dimensions)
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          timeout 1200 gradle runServer -Psmoke --no-daemon -Dorg.gradle.jvmargs=-Xmx3g 2>&1 | tee smoke.log || true
          echo "---- result ----"
          cat run/smoke-result.txt || { echo "no result file"; tail -80 smoke.log; exit 1; }
          grep -q "failures=0" run/smoke-result.txt
      - name: Publish result as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import os
          try: L=open('run/smoke-result.txt').read().splitlines()
          except Exception as e:
              L=['no result file: %s'%e]
              try:
                  log=[x for x in open('smoke.log',errors='replace').read().splitlines() if x.strip()]
                  L += ['LOG '+x[:220] for x in log[-60:]]
              except Exception as e2: L.append('no smoke.log: %s'%e2)
          for i in range(0,len(L),10):
              print('::notice title=smoke %d::%s'%(i//10,'%0A'.join(L[i:i+10])))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-result
          path: |
            run/smoke-result.txt
            smoke.log
