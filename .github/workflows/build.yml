name: Build TheLastSignal

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - name: Build
        run: gradle build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TheLastSignal-1.20.1-Forge
          path: build/libs/TheLastSignal-1.20.1-Forge.jar

  smoke-server:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - name: Headless server smoke test (generates chunks in all 48 dimensions)
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          timeout 1200 gradle runServer -Psmoke --no-daemon -Dorg.gradle.jvmargs=-Xmx3g 2>&1 | tee smoke.log || true
          echo "---- result ----"
          cat run/smoke-result.txt || { echo "no result file"; tail -80 smoke.log; exit 1; }
          grep -q "failures=0" run/smoke-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-result
          path: |
            run/smoke-result.txt
            smoke.log
